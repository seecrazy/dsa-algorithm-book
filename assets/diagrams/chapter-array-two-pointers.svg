<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
<title id="t">算法状态图</title><desc id="d">可视化算法状态迁移</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#334155"/></marker>
<marker id="blue-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/></marker>
<marker id="green-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#059669"/></marker>
<marker id="red-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/></marker>
</defs>
<style>
.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.box{stroke-width:2}
.plain{fill:#f8fafc;stroke:#94a3b8}
.blue{fill:#dbeafe;stroke:#2563eb}
.green{fill:#dcfce7;stroke:#059669}
.orange{fill:#ffedd5;stroke:#d97706}
.red{fill:#fee2e2;stroke:#dc2626}
.purple{fill:#ede9fe;stroke:#7c3aed}
.line{stroke:#64748b;stroke-width:2;fill:none}
.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#blue-arrow)}
.bad{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#red-arrow)}
.good{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#green-arrow)}
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;font-size:17px;fill:#111827;text-anchor:middle;font-weight:650}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;font-size:14px;fill:#475569;text-anchor:middle}
.small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;font-size:13px;fill:#64748b;text-anchor:middle}
.axis{stroke:#94a3b8;stroke-width:2}
.title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-size:21px;fill:#0f172a;text-anchor:start;font-weight:800}
</style>
<rect class="panel" x="10" y="10" width="700" height="360" rx="18"/>
<text class="title" x="32" y="50">对撞双指针：只移动“较弱的一侧”</text><rect class="box gray" x="64" y="105" width="56" height="64" rx="12"/><text class="t" x="92.0" y="143.0">1</text><text class="s" x="92" y="190">0</text><rect class="box blue" x="124" y="105" width="56" height="64" rx="12"/><text class="t" x="152.0" y="143.0">8</text><text class="s" x="152" y="190">1</text><rect class="box gray" x="184" y="105" width="56" height="64" rx="12"/><text class="t" x="212.0" y="143.0">6</text><text class="s" x="212" y="190">2</text><rect class="box gray" x="244" y="105" width="56" height="64" rx="12"/><text class="t" x="272.0" y="143.0">2</text><text class="s" x="272" y="190">3</text><rect class="box gray" x="304" y="105" width="56" height="64" rx="12"/><text class="t" x="332.0" y="143.0">5</text><text class="s" x="332" y="190">4</text><rect class="box gray" x="364" y="105" width="56" height="64" rx="12"/><text class="t" x="392.0" y="143.0">4</text><text class="s" x="392" y="190">5</text><rect class="box gray" x="424" y="105" width="56" height="64" rx="12"/><text class="t" x="452.0" y="143.0">8</text><text class="s" x="452" y="190">6</text><rect class="box gray" x="484" y="105" width="56" height="64" rx="12"/><text class="t" x="512.0" y="143.0">3</text><text class="s" x="512" y="190">7</text><rect class="box blue" x="544" y="105" width="56" height="64" rx="12"/><text class="t" x="572.0" y="143.0">7</text><text class="s" x="572" y="190">8</text><path class="arrow" d="M92,92 L85,85 L92,92 L58,58"/><path class="arrow" d="M500,500 L85,85 L500,500 L58,58"/><text class="s" x="92" y="48">left</text><text class="s" x="500" y="48">right</text><rect class="box green" x="58" y="230" width="604" height="64" rx="12"/><text class="s" x="360" y="258">面积 = (right-left) × min(height[left], height[right])</text><text class="s" x="360" y="281">短边决定水面；移动长边不可能变大，所以短边可安全淘汰</text><text class="s" x="360" y="340">蓝色是当前候选；灰色是已检查或当前区间内的其他柱子</text>
</svg>
